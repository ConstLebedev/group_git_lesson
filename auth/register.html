<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="centred_form">
        <form class="border border rounded p-3">
            <div class="mb-3">
              <label for="login" class="form-label">Логин</label>
              <input type="email" class="form-control" id="login" aria-describedby="emailHelp">
            </div>
            <div class="mb-3">
              <label for="psw1" class="form-label">Пароль</label>
              <input type="password" class="form-control" id="psw1">
            </div>
            <div class="mb-3">
                <label for="psw2" class="form-label">Повторите пароль</label>
                <input type="password" class="form-control" id="psw2">
            </div>
            <button type="submit" class="btn btn-primary mb-3">Подтвердить</button>
            <p>
                <a class="link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover" href="login.html">
                    Уже зарегистрированы? Войти
                </a>
            </p>
        </form>
    </div>

      <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
