<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Авторизация</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="centred_form">
      <div class="border rounded p-3" id="unlogged">
        <div class="mb-3">Вы не авторизованы</div>
        <a class="btn btn-primary mb-3 mx-2" href="login.html">Войти</a>
        <a class="btn btn-primary mb-3 mx-2" href="register.html"
          >Регистрация</a
        >
      </div>
      <div class="border rounded p-3" id="logged">
        <div class="mb-3" id="user_info">Вы вошли как "user"</div>
        <button class="btn btn-primary mb-3 mx-2" onclick="logout_and_check()">Выйти</button>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
    ></script>
    <script src="js/script.js"></script>
    <script>
        function check_user() {
            const user = get_user()
            const logged = document.querySelector('#logged')
            const ulogged = document.querySelector('#unlogged')
            if (user) {
                logged.style.display = 'block'
                const user_info = document.querySelector('#user_info')
                user_info.innerText = `Вы вошли как "${user.login}"`
                unlogged.style.display = 'none'
            } else {
                logged.style.display = 'none'
                unlogged.style.display = 'block'
            }
        }

        function logout_and_check() {
            logout()
            check_user()
        }

        document.addEventListener('DOMContentLoaded', check_user)
    </script>
  </body>
</html>
